[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "postfix-dane-policy"
dynamic = ["version"]
description = "DANE-aware TLS policy socketmap service for Postfix"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sebastian van de Meer", email = "kernel-error@kernel-error.com" }]
keywords = ["postfix", "dane", "tlsa", "dnssec", "smtp", "tls", "mta-sts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Mail Transport Agents",
    "Topic :: Security",
]
dependencies = ["dnspython>=2.0"]

[project.urls]
Homepage = "https://github.com/Kernel-Error/postfix-dane-policy"
Issues = "https://github.com/Kernel-Error/postfix-dane-policy/issues"

[project.scripts]
postfix-dane-policy = "postfix_dane_policy.server:main"

[tool.setuptools.dynamic]
version = { attr = "postfix_dane_policy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
